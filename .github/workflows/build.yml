name: Build and Deploy Jekyll (with plugins)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install image and document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp pandoc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install notebook support
        run: python -m pip install jupyter nbconvert

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Check stylesheet cache invalidation
        run: bundle exec ruby scripts/check_cache_bust.rb
      - name: Test catalogue discovery and snapshot safety
        run: python -m unittest discover -s tests -v
      - name: Build site
        run: bundle exec jekyll build --trace
      - name: Verify pages, local links, metadata and sitemap
        id: verify
        shell: bash
        run: python scripts/verify_site.py _site 2>&1 | tee verification.log

      - name: Save catalogue preview for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalogue-preview
          retention-days: 7
          path: |
            _site/repositories
            _site/assets/css
            _site/assets/js
            _site/assets/fonts
            _site/assets/webfonts

      - name: Audit resolved Ruby dependencies
        id: ruby_audit
        shell: bash
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update 2>&1 | tee ruby-audit.log
      - name: Audit npm tooling dependencies
        id: npm_audit
        shell: bash
        run: npm audit --package-lock-only 2>&1 | tee npm-audit.log

      - name: Record verification details
        if: always() && steps.verify.outcome != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_RESULT: ${{ job.status }}
        run: |
          cat verification.log > checks.log
          for report in ruby-audit.log npm-audit.log; do
            if [ -f "$report" ]; then cat "$report" >> checks.log; fi
          done
          jq -n --arg sha "$CHECK_SHA" --arg result "$CHECK_RESULT" --rawfile report checks.log --rawfile lock Gemfile.lock \
            '{name: "Generated site verification", head_sha: $sha, status: "completed", conclusion: $result, output: {title: "Generated site verification", summary: $report, text: $lock}}' > verification-check.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input verification-check.json > /dev/null

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
