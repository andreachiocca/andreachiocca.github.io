name: Build and Deploy Jekyll (with plugins)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install image and document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp pandoc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install notebook support
        run: python -m pip install jupyter nbconvert

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Check stylesheet cache invalidation
        run: bundle exec ruby scripts/check_cache_bust.rb
      - name: Build site
        run: bundle exec jekyll build --trace
      - name: Verify pages, local links, metadata and sitemap
        run: python scripts/verify_site.py _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
