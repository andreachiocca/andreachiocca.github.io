name: Preview website on Cloudflare Pages

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: website-preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp pandoc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jupyter nbconvert
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build isolated preview
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --trace --config _config.yml,_config_preview.yml
          python scripts/verify_site.py _site
          python scripts/verify_languages.py _site
      - name: Publish preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the website-preview environment."
            exit 1
          fi
          branch="pr-${PR_NUMBER:-manual}"
          npx --yes wrangler@3 pages deploy _site --project-name academic-website-preview --branch "$branch"
