<ul class="list-unstyled">
{% assign certificates = data[1] | sort: 'date' | reverse %}
{% for certificate in certificates %}
<li class="mb-3">
  <h3 class="h5">{% if certificate.url %}<a href="{{ certificate.url }}">{{ certificate.name }}</a>{% else %}{{ certificate.name }}{% endif %}</h3>
  <p>{{ certificate.issuer }} · {{ certificate.date }}</p>
</li>
{% endfor %}
</ul>
