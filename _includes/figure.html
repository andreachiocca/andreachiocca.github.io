{%- assign img_path = include.path | remove: ".jpg" | remove: ".jpeg" | remove: ".png" | remove: ".tiff" -%}
<figure>
  <picture>
    {% if site.imagemagick.enabled %}
    <source type="image/webp"
      srcset="{% for width in site.imagemagick.widths %}{{ img_path | relative_url }}-{{ width }}.webp {{ width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
      sizes="{{ include.sizes | default: '(min-width: 800px) 800px, 100vw' }}">
    {% endif %}
    <img
      src="{% if include.cache_bust %}{{ include.path | relative_url | bust_file_cache }}{% else %}{{ include.path | relative_url }}{% endif %}"
      {% if include.class %}class="{{ include.class }}"{% endif %}
      {% if include.width %}width="{{ include.width }}"{% endif %}
      {% if include.height %}height="{{ include.height }}"{% endif %}
      alt="{{ include.alt | default: '' | escape }}"
      {% if include.title %}title="{{ include.title | escape }}"{% endif %}
      loading="{{ include.loading | default: 'lazy' }}"
      decoding="async"
      {% if include.fetchpriority %}fetchpriority="{{ include.fetchpriority }}"{% endif %}
      {% if include.zoomable %}data-zoomable{% endif %}
      onerror="this.onerror=null; this.parentElement.querySelectorAll('source').forEach(function(source) { source.remove(); });"
    />
  </picture>
  {%- if include.caption -%}<figcaption class="caption">{{ include.caption }}</figcaption>{%- endif %}
</figure>
